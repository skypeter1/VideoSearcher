<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8">
    <title>Video Searcher</title>
    <meta name="description" content="Search YouTube videos by topic">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body ng-app="VideoSearchApp">
    <div class="header">
      <div class="navbar navbar-inverse" role="navigation"></div>
    </div>

    <div class="container">
      <div ng-view></div>
    </div>

    <div class="footer">
      <div class="container">
        <p><span class="glyphicon glyphicon-facetime-video"></span> Peter Arboleda</p>
      </div>
    </div>

    <script src="/config.js"></script>
    <script src="/node_modules/jquery/dist/jquery.min.js"></script>
    <script src="/node_modules/angular/angular.min.js"></script>
    <script src="/node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="/node_modules/angular-animate/angular-animate.min.js"></script>
    <script src="/node_modules/angular-cookies/angular-cookies.min.js"></script>
    <script src="/node_modules/angular-resource/angular-resource.min.js"></script>
    <script src="/node_modules/angular-route/angular-route.min.js"></script>
    <script src="/node_modules/angular-sanitize/angular-sanitize.min.js"></script>
    <script src="/node_modules/angular-touch/angular-touch.min.js"></script>
    <script src="/node_modules/angular-local-storage/dist/angular-local-storage.min.js"></script>

    <script src="scripts/services/module.js"></script>
    <script src="scripts/services/VideoService.js"></script>
    <script src="scripts/model/module.js"></script>
    <script src="scripts/model/localStorage.js"></script>
    <script src="scripts/app.js"></script>
    <script src="scripts/controllers/main.js"></script>
  </body>
</html>
